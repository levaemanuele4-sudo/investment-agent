name: Daily Investment Agent

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run Investment Agent
        run: python main.py
        env:
          HOLDINGS_VWCE: ${{ secrets.HOLDINGS_VWCE }}
          HOLDINGS_IBTM: ${{ secrets.HOLDINGS_IBTM }}
          INITIAL_CAPITAL: ${{ secrets.INITIAL_CAPITAL }}
          INFLATION_RATE: ${{ secrets.INFLATION_RATE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          
